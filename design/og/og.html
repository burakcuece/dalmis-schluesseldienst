<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --yellow:#f5c400; --black:#111; --ink:#fff; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1200px; height:630px; }
  body { background:var(--black); color:#fff; font-family:"Barlow-a13127b31be781c1", sans-serif; position:relative; overflow:hidden; }
  .band { position:absolute; left:0; right:0; bottom:0; height:132px; background:#1b1b1b; border-top:6px solid var(--yellow); }
  .wrap { position:absolute; inset:0; padding:56px 72px 0; }
  .brand { display:flex; align-items:center; gap:16px; }
  .brand svg { width:52px; height:52px; }
  .brand svg path:first-child { fill:var(--yellow); } .brand svg .key { fill:var(--black); }
  .brand b { font-family:"Barlow-a13127b31be781c1"; font-weight:700; font-size:30px; letter-spacing:.16em; }
  .brand small { display:block; font-size:17px; font-weight:600; color:rgba(255,255,255,.66); letter-spacing:.02em; margin-top:2px; }
  h1 { font-family:"Barlow Condensed-52e98fab7e54cdc2"; margin-top:58px; line-height:.95; }
  h1 span { display:inline-block; font-size:150px; font-weight:800; text-transform:uppercase; letter-spacing:.005em;
            background:linear-gradient(transparent 80%, rgba(245,196,0,.9) 80%); }
  h1 strong { display:block; font-size:60px; font-weight:700; margin-top:14px; }
  .facts { position:absolute; left:72px; right:72px; bottom:0; height:126px; display:flex; align-items:center; gap:56px; }
  .fact { display:flex; align-items:center; gap:16px; font-size:30px; font-weight:600; color:rgba(255,255,255,.85); }
  .fact svg { width:38px; height:38px; fill:var(--yellow); flex:none; }
  .fact.phone { font-family:"Barlow Condensed-52e98fab7e54cdc2"; font-size:46px; font-weight:800; color:#fff; letter-spacing:.01em; }
  .mark { position:absolute; right:72px; top:118px; width:250px; height:250px; }
  .mark path:first-child { fill:var(--yellow); } .mark .key { fill:var(--black); }
</style></head>
