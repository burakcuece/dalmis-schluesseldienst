  <div class="label" id="label"></div>
  <div class="stage" id="stage"><iframe class="frame" id="frame" title="DALMIS Responsive Test" src="./index.html?v=20260923b"></iframe></div>
  <script>
    const allowed=[320,360,375,390,430,768,820,1024,1280,1440,1920];
    const requested=Number(new URLSearchParams(location.search).get('w'));
    const width=allowed.includes(requested)?requested:390;
    const frame=document.getElementById('frame');
    const stage=document.getElementById('stage');
    const scale=Math.min(1,(innerWidth-32)/width);
    frame.style.width=width+'px';
    stage.style.width=width+'px';
    stage.style.transform='scale('+scale+')';
    document.getElementById('label').textContent=width+' px · Maßstab '+Math.round(scale*100)+' %';
  </script>
